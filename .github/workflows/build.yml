# Does a clean checkout build?
#
# Deliberately the only thing CI does. The tests run locally before a push
# (AGENTS.md, "Test gates"): the ones that matter need camera fixtures and the
# Python oracle, which this CI checkout does not provision. What a local
# build cannot see is a clean checkout — a file on disk but not committed, a
# project not regenerated after adding a source file — and that is this job.

name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27          # GitHub's arm64 image with Xcode 27 (public preview); macos-26 has none
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The app needs Xcode 27 or later (README, Build): Xcode 26 gives up type-checking a few of
      # its expressions. The newest Xcode 27 on the image, or a clear failure (2026-11-08).
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i -E "candidate|beta" | sort -V | tail -1)
          if [ -z "$x" ]; then echo "::error::no Xcode 27 on this runner image; the app needs Xcode 27 or later"; exit 1; fi
          sudo xcode-select -s "$x"
          xcodebuild -version

      # From Xcode 26 the Metal compiler is a separate component.
      - name: Metal toolchain
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx --find metallib

      # The Mac app is a Mac Catalyst app: its own engine build (engine/ for macabi, safe-math
      # kernels), its generated project, a Mac Catalyst build.
      - name: Engine for Mac Catalyst
        run: app/SpektraLab/tools/build_engine_mac.sh

      - name: App
        working-directory: app/SpektraLab
        run: |
          python3 gen_project.py
          xcodebuild -project SpektraLab.xcodeproj -scheme SpektraLab -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' -jobs 4 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build
