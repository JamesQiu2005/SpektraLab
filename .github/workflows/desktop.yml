name: Windows v2 package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-v2-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-windows-cross:
    if: github.ref == 'refs/heads/Windows_Linux_v2'
    name: Engine + host (Windows x64, cross-built)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: MinGW-w64, wine and Mesa's CPU Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build nasm glslang-tools python3 python3-venv pkg-config ccache \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 \
            wine wine64 xvfb xauth libvulkan1 mesa-vulkan-drivers   # `wine` is the command; wine64 alone does not provide it
          python3 -m venv "$RUNNER_TEMP/spk-build-python"
          "$RUNNER_TEMP/spk-build-python/bin/pip" install meson==1.9.2
          echo "$RUNNER_TEMP/spk-build-python/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: engine-deps-${{ runner.os }}-cross-${{ hashFiles('engine/setup-*.sh', 'engine/setup-*.py', 'engine/cmake/*pins.json', 'engine/cmake/input-dependencies/**') }}

      - name: Restore MinGW compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spektralab-mingw-ccache
          key: spk-mingw-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/cmake/toolchain-mingw-w64.cmake') }}-${{ github.sha }}
          restore-keys: |
            spk-mingw-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/cmake/toolchain-mingw-w64.cmake') }}-

      - name: Dependency setup regression tests
        run: python3 -m unittest discover -s engine/tests -p 'test_*codec*.py' -v

      # Also fails if the exe imports anything but system DLLs.
      - name: Cross-build spektralab-host.exe
        env:
          CCACHE_DIR: ${{ runner.temp }}/spektralab-mingw-ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 300M
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          time engine/build-windows-cross.sh
          ccache --show-stats

      # winevulkan loads only through wine's X11 driver, hence xvfb-run; it
      # then forwards to the Linux loader, i.e. lavapipe.
      - name: Host smoke under wine
        env:
          WINEDEBUG: -all
        run: |
          xvfb-run -a python3 engine/tests/host_smoke.py --wrapper wine --require-raw-openmp \
            --host build/host-win-x64/spektralab-host.exe \
            --resources build/host-win-x64/engine

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Pack the staged host
        run: |
          node .github/scripts/windows-host-artifact.mjs write build/host-win-x64
          tar -C build -czf host-win-x64.tgz host-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: host-win-x64
          path: host-win-x64.tgz
          retention-days: 14

  engine-windows-msvc:
    if: github.ref == 'refs/heads/Windows_Linux_v2'
    name: Engine (Windows x64, MSVC, CTest)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v4
        with:
          path: build/deps
          key: engine-deps-windows-msvc-${{ runner.arch }}-${{ hashFiles('.github/scripts/windows-engine-deps.ps1', 'engine/setup-libraw.ps1', 'engine/setup-libraw.sh', 'engine/third_party/libraw-pin/**') }}

      # CMake 3.31.6 rather than whatever the image defaults to: 4.x refuses a
      # cmake_minimum_required without a version range, which is what this tree
      # writes. Vulkan-Headers and glslang are the pins engine/setup-deps.sh
      # uses, here by commit and by SHA-256; the loader is never linked, volk
      # opens vulkan-1.dll at run time.
      - name: Pinned CMake, Vulkan headers, glslang, LibRaw
        shell: pwsh
        run: |
          ./.github/scripts/windows-engine-deps.ps1 -DependencyDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/deps') -GitHubEnvironmentFile $env:GITHUB_ENV

      - name: Configure, build, CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = $env:SPK_CMAKE
          $ctest = $env:SPK_CTEST
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninja) { throw 'ninja is not on PATH' }
          & $cmake --version | Select-Object -First 1
          "ninja: $ninja"

          # /utf-8: the tree carries UTF-8 sources and MSVC otherwise reads them
          # in the ANSI code page. SPEKTRALAB_REQUIRE_VULKAN=ON makes a missing
          # toolchain a configure error instead of a silent portable-core build.
          $configure = @(
              '-S', $env:GITHUB_WORKSPACE,
              '-B', 'build/root-msvc',
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$ninja",
              '-DCMAKE_BUILD_TYPE=Release',
              "-DSPEKTRALAB_VULKAN_HEADERS=$env:SPK_VULKAN_HEADERS",
              "-DSPEKTRALAB_GLSLANG=$env:SPK_GLSLANG",
              "-DSPEKTRALAB_LIBRAW_SOURCE=$env:SPK_LIBRAW_SOURCE",
              '-DSPEKTRALAB_REQUIRE_VULKAN=ON',
              '-DSPEKTRALAB_LIBRAW_OPENMP=OFF',
              '-DSPEKTRALAB_BUILD_NATIVE_RAW=ON',
              '-DSPEKTRALAB_BUILD_HOST=OFF',
              '-DBUILD_TESTING=ON',
              '-DCMAKE_C_FLAGS=/utf-8',
              '-DCMAKE_CXX_FLAGS=/utf-8'
          )
          & $cmake @configure
          if ($LASTEXITCODE) { throw "configure exited $LASTEXITCODE" }

          & $cmake --build build/root-msvc --parallel
          if ($LASTEXITCODE) { throw "build exited $LASTEXITCODE" }

          # ctest reading zero tests would pass silently; the tree has 34.
          $listing = & $ctest --test-dir build/root-msvc -N
          $listing | Select-Object -Last 3
          $total = [int]([regex]::Match(($listing -join "`n"), 'Total Tests: (\d+)').Groups[1].Value)
          if ($total -lt 30) { throw "ctest registered $total tests; the MSVC configuration lost most of them" }

          # The hosted image has no Vulkan loader and no ICD, so every suite that
          # creates a device or an engine stops on "no Vulkan loader found".
          # gpu_vulkan_smoke.cpp:537 turns that into return 1, and there is no
          # skip path in these tests. The cross-built Windows host exercises
          # CPU Vulkan through Wine and lavapipe in engine-windows-cross.
          $noGpu = '^(spk_vulkan_|spk_math_gate_|spk_windows_(c_abi|feature_boundaries)$)'
          $kept = & $ctest --test-dir build/root-msvc -N -E $noGpu
          $keptTotal = [int]([regex]::Match(($kept -join "`n"), 'Total Tests: (\d+)').Groups[1].Value)
          if ($keptTotal -lt 10) { throw "the exclusion left $keptTotal tests; expected at least 10" }

          & $ctest --test-dir build/root-msvc --output-on-failure -E $noGpu
          if ($LASTEXITCODE) { throw "ctest exited $LASTEXITCODE" }

  desktop-checks:
    if: github.ref == 'refs/heads/Windows_Linux_v2'
    name: Windows frontend and scheduler
    uses: ./.github/workflows/windows-v2.yml
    with:
      package-build: true

  package-windows:
    name: Package (Windows NSIS installer)
    needs: [engine-windows-cross, engine-windows-msvc, desktop-checks]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: host-win-x64
          path: build

      - name: Unpack the staged host
        shell: bash
        run: |
          tar -C build -xzf build/host-win-x64.tgz
          node .github/scripts/windows-host-artifact.mjs verify build/host-win-x64

      # The cross-built exe on a real Windows: starts, speaks the protocol,
      # and reports the missing Vulkan driver instead of crashing.
      - name: Host answers hello (real Windows, no GPU)
        run: python .github/scripts/host_hello.py --host build/host-win-x64/spektralab-host.exe --resources build/host-win-x64/engine

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'spektralab-package-build.log'
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/package.mjs win *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed app and extracted portable
        timeout-minutes: 10
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'spektralab-package-verify.log'
          try {
            & {
              $setups = @(Get-ChildItem desktop/release/windows/*-setup.exe -File)
              if ($setups.Count -ne 1) { throw "Expected one Windows installer, found $($setups.Count)" }
              ./.github/scripts/windows-package-check.ps1 -Installer $setups[0].FullName `
                -ArtifactDirectory $setups[0].DirectoryName -ScratchRoot $env:RUNNER_TEMP -VerifyDesktop
            } *>&1 | Tee-Object -FilePath $log
          } catch {
            Add-Content -LiteralPath $log -Value $_.ToString()
            throw
          }

      - name: Save Windows packaging logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spektralab-windows-package-logs
          path: ${{ runner.temp }}/spektralab-package-*.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: spektralab-windows-x64
          path: |
            desktop/release/windows/*-setup.exe
            desktop/release/windows/*-portable.zip
          if-no-files-found: error
          retention-days: 14
