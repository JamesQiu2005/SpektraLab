[package]
name = "spektralab"
version = "2.0.0-alpha.1"
description = "SpektraLab — film and print emulation (Linux / Windows)"
authors = ["SpektraLab contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
default-run = "spektralab"

[workspace]
# One lockfile and one target/ for the app and the two crates it wires (phase 2, PRD-W2 R10).
# The crates live outside this directory, so each names this workspace in its [package].
members = [".", "../crates/spk-scheduler", "../crates/spk-library"]
resolver = "2"

[lib]
name = "spektralab_lib"
# This package is a desktop executable, with a Rust library shared by main
# and tests. It exposes no C ABI/mobile library. Building an unused cdylib
# also triggers MinGW's PE export-ordinal limit with newer Rust compilers.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
sha2 = "0.10"
log = "0.4"
spk-scheduler = { path = "../crates/spk-scheduler" }
spk-library = { path = "../crates/spk-library" }
async-trait = "0.1"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
