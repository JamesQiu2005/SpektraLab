[package]
name = "develop"
version = "1.0.0"
description = "Develop — film and print emulation for Linux, based on SpektraLab"
authors = ["jegly", "SpektraLab contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
default-run = "develop"

[lib]
name = "spektralab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
sha2 = "0.10"
log = "0.4"
# Android uploads arrive base64-encoded in parts (lib.rs upload_part): the WebView there sends JSON only.
base64 = "0.22"

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "2"

# Desktop only: Android owns the window (always full screen).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# src/no_network.rs: the seccomp filter that keeps the app off the network
libc = "0.2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
