[package]
name = "spk-library"
version = "0.1.0"
description = "SpektraLab's client of the library helper (spklib-host): spawn, JSON lines, typed calls"
authors = ["SpektraLab contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false
# A member of the app's workspace (phase 2): one Cargo.lock and one target/ in desktop/src-tauri.
workspace = "../../src-tauri"

# Phase 2: a member of the app's workspace (desktop/src-tauri), which depends on
# it by path. No tauri, no async runtime: the client is blocking and
# thread-safe; the app calls it from spawn_blocking.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
