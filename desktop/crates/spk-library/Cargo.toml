[package]
name = "spk-library"
version = "0.1.0"
description = "SpektraLab's client of the library helper (spklib-host): spawn, JSON lines, typed calls"
authors = ["SpektraLab contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false

# A standalone package in phase 1 (PRD-W0 §4): no [workspace] here, and the
# app's Cargo.toml does not depend on it yet. No tauri, no async runtime: the
# client is blocking and thread-safe; the app calls it from spawn_blocking.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
